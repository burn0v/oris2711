{% extends "base.html" %}

{% block title %}
Добавить текстуру
{% endblock %}

{% block content %}

<h2>Новая текстура</h2>

{% for error in errors|default([]) %}
    <p>{{ error }}</p>
{% endfor %}

<form method="POST" enctype="multipart/form-data">

    <p>
        <label>Название</label>
        <input type="text" name="title" value="{{ title|default('') }}">
    </p>

    <p>
        <label>Описание</label>
        <textarea name="description">{{ description|default('') }}</textarea>
    </p>

    <p>
        <label>Изображение текстуры</label>
        <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif" required>
    </p>

    <button type="submit">Сохранить</button>

</form>

{% endblock %}
