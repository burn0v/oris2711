{% extends "base.html" %}

{% block title %}
Главная — TextureBox
{% endblock %}

{% block content %}

<h2>Мои текстуры</h2>

{% if textures %}

    {% for texture in textures %}
        <div>
            <h3>{{ texture.title }}</h3>
            <p>{{ texture.description }}</p>
            <a href="{{ url_for('detail', texture_id=texture.id) }}">Подробнее</a>
        </div>
        <hr>
    {% endfor %}

{% else %}
    <p>Пока текстур нет.</p>
{% endif %}

{% endblock %}
